<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRL Console QR Config Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page">
      <h1>IRL Console QR config generator</h1>
      <p class="subtitle">
        Build the exact JSON payload used by the IRL Console app and generate a QR code from your desktop.
      </p>

      <div class="grid">
        <section class="card">
          <h2>Configuration</h2>

          <div class="profile-row">
            <div class="field">
              <label for="profileName">Profile name</label>
              <input id="profileName" type="text" placeholder="My profile" />
            </div>

            <div class="field">
              <label for="profileSelect">Saved profiles</label>
              <select id="profileSelect">
                <option value="">Choose a profile</option>
              </select>
            </div>
          </div>

          <div class="toolbar profile-toolbar">
            <button class="primary" id="saveProfileBtn" type="button">Save profile</button>
            <button class="secondary" id="deleteProfileBtn" type="button">Delete profile</button>
            <button class="secondary" id="newProfileBtn" type="button">New</button>
          </div>

          <div class="field-grid">
            <div class="field">
              <label for="panelCount">Panel count</label>
              <select id="panelCount">
                <option value="2" selected>2 panels</option>
                <option value="4">4 panels</option>
              </select>
            </div>

            <div class="field full">
              <label for="browserSource1">Browser overlay 1 URL</label>
              <input id="browserSource1" type="url" value="" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="browserSource2">Browser overlay 2 URL</label>
              <input id="browserSource2" type="url" value="" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="customPanel1">Custom panel 1 URL (optional)</label>
              <input id="customPanel1" type="url" value="" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="customPanel2">Custom panel 2 URL (optional)</label>
              <input id="customPanel2" type="url" value="" placeholder="https://..." />
            </div>
          </div>

          <div class="panel-preview">
            <h3>Panel assignments</h3>
            <div id="panelRows"></div>
          </div>

          <div class="toolbar">
            <span></span>
          </div>
        </section>

        <aside class="card">
          <h2>QR code</h2>
          <div class="qr-box">
            <canvas id="qrCanvas" width="320" height="320"></canvas>
          </div>
          <div class="status" id="status">Ready.</div>
        </aside>
      </div>

      <section class="card" style="margin-top: 24px;">
        <div class="section-header-row">
          <h2>JSON payload</h2>
          <button class="secondary" id="copyBtn" type="button">Copy JSON</button>
        </div>
        <textarea id="jsonOutput" spellcheck="false"></textarea>
      </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
