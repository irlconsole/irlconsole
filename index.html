<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stream Console QR Config Generator</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --border: #dfe7f2;
        --text: #1a2433;
        --muted: #5b6b7d;
        --accent: #1e90ff;
        --accent-soft: #eaf4ff;
        --danger: #d14343;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 40px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw, 2.5rem);
      }

      .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(26, 36, 51, 0.04);
        padding: 20px;
      }

      .card h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 1.2rem;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
      }

      textarea {
        resize: vertical;
        min-height: 160px;
        line-height: 1.5;
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
        font-weight: 600;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--accent);
        color: white;
      }

      .secondary {
        background: #eef3f9;
        color: var(--text);
      }

      .danger {
        background: #fff1f1;
        color: var(--danger);
      }

      .panel-preview {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
      }

      .panel-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        align-items: center;
        gap: 10px;
      }

      .panel-row select {
        min-width: 0;
      }

      .qr-box {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 320px;
        background: linear-gradient(180deg, #ffffff 0%, #f7faff 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
      }

      canvas {
        max-width: 100%;
        display: block;
      }

      .status {
        min-height: 22px;
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Stream Console QR config generator</h1>
      <p class="subtitle">
        Build the exact JSON payload used by the Stream Console app and generate a QR code from your desktop.
      </p>

      <div class="grid">
        <section class="card">
          <h2>Configuration</h2>

          <div class="field-grid">
            <div class="field">
              <label for="username">Twitch username</label>
              <input id="username" type="text" value="yourname" placeholder="yourname" />
            </div>

            <div class="field">
              <label for="panelCount">Panel count</label>
              <select id="panelCount">
                <option value="2">2 panels</option>
                <option value="4" selected>4 panels</option>
              </select>
            </div>

            <div class="field full">
              <label for="browserSource1">Browser overlay 1 URL</label>
              <input id="browserSource1" type="url" value="https://streamlabs.com/widgets/chat-box/your-channel" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="browserSource2">Browser overlay 2 URL</label>
              <input id="browserSource2" type="url" value="https://streamlabs.com/widgets/alert-box/your-channel" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="customPanel1">Custom panel 1 URL</label>
              <input id="customPanel1" type="url" value="https://example.com/goal-widget" placeholder="https://..." />
            </div>

            <div class="field full">
              <label for="customPanel2">Custom panel 2 URL</label>
              <input id="customPanel2" type="url" value="https://example.com/up-next" placeholder="https://..." />
            </div>
          </div>

          <div class="panel-preview">
            <h3>Panel assignments</h3>
            <div id="panelRows"></div>
          </div>

          <div class="toolbar">
            <button class="primary" id="generateBtn" type="button">Generate QR</button>
            <button class="secondary" id="fillExampleBtn" type="button">Use example</button>
            <button class="secondary" id="copyBtn" type="button">Copy JSON</button>
          </div>
        </section>

        <aside class="card">
          <h2>QR code</h2>
          <div class="qr-box">
            <canvas id="qrCanvas" width="320" height="320"></canvas>
          </div>
          <div class="status" id="status">Ready.</div>
        </aside>
      </div>

      <section class="card" style="margin-top: 24px;">
        <h2>JSON payload</h2>
        <textarea id="jsonOutput" spellcheck="false"></textarea>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script>
      const moduleNameMap = {
        "activity-feed": "Twitch Activity Feed",
        "chat": "Twitch Chat",
        "custom-1": "Custom 1",
        "custom-2": "Custom 2",
      };

      const panelCountEl = document.getElementById('panelCount');
      const panelRowsEl = document.getElementById('panelRows');
      const statusEl = document.getElementById('status');
      const jsonOutputEl = document.getElementById('jsonOutput');
      const qrCanvas = document.getElementById('qrCanvas');

      function getPanelAssignments() {
        const assignments = [];
        const count = Number(panelCountEl.value) || 2;
        for (let index = 0; index < 4; index += 1) {
          const select = document.getElementById(`panel-${index + 1}`);
          assignments.push(select ? select.value : 'activity-feed');
        }
        return { assignments, count };
      }

      function renderPanelRows() {
        const rows = [];
        for (let index = 0; index < 4; index += 1) {
          rows.push(`
            <div class="panel-row">
              <label>Panel ${index + 1}</label>
              <select id="panel-${index + 1}">
                <option value="activity-feed">Twitch Activity Feed</option>
                <option value="chat">Twitch Chat</option>
                <option value="custom-1">Custom 1</option>
                <option value="custom-2">Custom 2</option>
              </select>
            </div>
          `);
        }
        panelRowsEl.innerHTML = rows.join('');

        const firstTwo = ['activity-feed', 'chat'];
        const firstFour = ['activity-feed', 'chat', 'custom-1', 'custom-2'];
        const defaults = Number(panelCountEl.value) === 4 ? firstFour : firstTwo;

        defaults.forEach((value, index) => {
          const select = document.getElementById(`panel-${index + 1}`);
          if (select) {
            select.value = value;
          }
        });
      }

      function buildConfig() {
        const config = {
          type: 'stream-console-config',
          version: 1,
          username: document.getElementById('username').value.trim(),
          panelCount: Number(panelCountEl.value) === 4 ? 4 : 2,
          panelAssignments: getPanelAssignments().assignments,
          browserSource1: document.getElementById('browserSource1').value.trim(),
          browserSource2: document.getElementById('browserSource2').value.trim(),
          customPanel1: document.getElementById('customPanel1').value.trim(),
          customPanel2: document.getElementById('customPanel2').value.trim(),
        };

        return config;
      }

      function updateJson() {
        const config = buildConfig();
        const json = JSON.stringify(config, null, 2);
        jsonOutputEl.value = json;
        return json;
      }

      function generateQr() {
        const json = updateJson();
        statusEl.textContent = 'Generating QR code…';

        QRCode.toCanvas(qrCanvas, json, {
          width: 300,
          margin: 2,
          color: { dark: '#0d172a', light: '#ffffff' },
          errorCorrectionLevel: 'M'
        }, function (error) {
          if (error) {
            statusEl.textContent = 'Unable to generate QR code.';
            console.error(error);
            return;
          }
          statusEl.textContent = 'QR code ready to scan.';
        });
      }

      async function copyJson() {
        const json = updateJson();
        try {
          await navigator.clipboard.writeText(json);
          statusEl.textContent = 'JSON copied to clipboard.';
        } catch (error) {
          statusEl.textContent = 'Clipboard copy unavailable in this browser.';
        }
      }

      function fillExample() {
        document.getElementById('username').value = 'yourname';
        document.getElementById('panelCount').value = '4';
        document.getElementById('browserSource1').value = 'https://streamlabs.com/widgets/chat-box/your-channel';
        document.getElementById('browserSource2').value = 'https://streamlabs.com/widgets/alert-box/your-channel';
        document.getElementById('customPanel1').value = 'https://example.com/goal-widget';
        document.getElementById('customPanel2').value = 'https://example.com/up-next';
        renderPanelRows();
        const defaults = ['activity-feed', 'chat', 'custom-1', 'custom-2'];
        defaults.forEach((value, index) => {
          const select = document.getElementById(`panel-${index + 1}`);
          if (select) select.value = value;
        });
        generateQr();
      }

      document.getElementById('generateBtn').addEventListener('click', generateQr);
      document.getElementById('copyBtn').addEventListener('click', copyJson);
      document.getElementById('fillExampleBtn').addEventListener('click', fillExample);
      panelCountEl.addEventListener('change', renderPanelRows);

      renderPanelRows();
      generateQr();
    </script>
  </body>
</html>
